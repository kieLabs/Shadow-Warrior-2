<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08111b">
  <title>SHADOW WARRIOR — GamerKie</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#08111b;color:#eef6f2;font-family:system-ui,sans-serif}
    .gk-embed{width:100%;max-width:1100px;margin:0 auto;padding:10px}
    .gk-bar{height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 5px;color:#4ce0bd;font-weight:900;letter-spacing:2px;font-size:13px}
    .gk-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#07111a;border:1px solid #35515b;border-radius:10px}
    .gk-frame iframe{display:block;width:100%;height:100%;border:0;background:#07111a}
    .gk-cover{position:absolute;inset:0;z-index:2;display:grid;place-content:center;text-align:center;gap:12px;background:linear-gradient(120deg,#0b1926ee,#173849df),radial-gradient(circle at 70% 30%,#4ce0bd55,transparent 38%)}
    .gk-cover h1{font-size:clamp(24px,5vw,52px);margin:0;letter-spacing:3px}.gk-cover p{margin:0;color:#aac5c0;font-size:12px;letter-spacing:2px}
    .gk-cover button{justify-self:center;border:1px solid #4ce0bd;background:#164e4b;color:#fff;padding:14px 30px;border-radius:7px;font-weight:900;letter-spacing:2px;cursor:pointer}
    .gk-actions{display:flex;justify-content:flex-end;padding-top:7px}.gk-actions button{border:1px solid #2d5960;background:#112a38;color:#b8eee1;border-radius:6px;padding:7px 13px;cursor:pointer}
    @media(max-width:600px){.gk-embed{padding:3px}.gk-frame{border-radius:4px}.gk-bar{height:30px;font-size:11px}}
  </style>
</head>
<body>
  <main class="gk-embed">
    <div class="gk-bar"><span>GAMERKIE</span><span>SHADOW WARRIOR</span></div>
    <div class="gk-frame" id="gkFrame">
      <iframe id="gkGame" src="./index.html" title="Shadow Warrior — GamerKie Edition" allow="fullscreen; autoplay" allowfullscreen></iframe>
      <div class="gk-cover" id="gkCover"><h1>SHADOW WARRIOR</h1><p>FIGHT YOUR WAY. BECOME A LEGEND.</p><button id="gkPlay">▶ PLAY NOW</button></div>
    </div>
    <div class="gk-actions"><button id="gkFullscreen">⛶ Fullscreen</button></div>
  </main>
  <script>
    const cover=document.getElementById('gkCover');
    document.getElementById('gkPlay').addEventListener('click',()=>{cover.hidden=true;document.getElementById('gkGame').contentWindow.focus();});
    document.getElementById('gkFullscreen').addEventListener('click',()=>{const frame=document.getElementById('gkFrame');if(!document.fullscreenElement)frame.requestFullscreen?.();else document.exitFullscreen?.();});
  </script>
</body>
</html>
